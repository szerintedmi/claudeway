<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glasses Test UI</title>
<link rel="icon" href="/favicon.ico" type="image/svg+xml">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
  .header { padding: 12px 16px; background: #16213e; border-bottom: 1px solid #333; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .header input { background: #0f3460; border: 1px solid #444; color: #e0e0e0; padding: 6px 10px; border-radius: 4px; font-size: 13px; }
  .header input.url { flex: 1; min-width: 200px; }
  .header input.token { width: 180px; }
  .header button { padding: 6px 14px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 500; }
  .btn-connect { background: #0a9396; color: white; }
  .btn-connect:hover { background: #0b7a7d; }
  .btn-disconnect { background: #ae2012; color: white; }
  .btn-disconnect:hover { background: #9b1b0e; }
  .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .status-dot.connected { background: #2ecc71; }
  .status-dot.disconnected { background: #e74c3c; }
  .messages { flex: 1; overflow-y: auto; padding: 12px 16px; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 13px; line-height: 1.5; }
  .msg { margin-bottom: 6px; word-break: break-word; }
  .msg .time { color: #666; margin-right: 8px; }
  .msg.sent { color: #74b9ff; }
  .msg.received { color: #a8e6cf; }
  .msg.error { color: #ff7675; }
  .msg.system { color: #fdcb6e; }
  .msg.status { color: #b8b8b8; font-style: italic; }
  .msg.status .spinner { display: inline-block; animation: spin 1s linear infinite; margin-right: 6px; }
  .msg.status.step { color: #c0c0c0; font-style: normal; }
  .msg.status.step .dot { margin-right: 6px; color: #2ecc71; }
  .msg.status.step .tool-name { color: #e0e0e0; font-weight: 600; }
  .msg.status.step .tool-arg { color: #b8b8b8; font-weight: normal; }
  .msg.status.step .sub-detail { display: block; padding-left: 22px; color: #777; font-size: 12px; margin-top: 1px; }
  .msg.status.agent-detail { font-style: italic; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .msg.transcript { color: #dfe6e9; font-style: italic; }
  .msg.received pre { background: #0f3460; padding: 8px 10px; border-radius: 4px; margin: 4px 0; overflow-x: auto; }
  .msg.received code { background: #0f3460; padding: 1px 4px; border-radius: 3px; font-size: 12px; }
  .msg.received pre code { background: none; padding: 0; }
  .msg.received p { margin: 4px 0; }
  .msg.received > span > p:first-child { display: inline; }
  .msg.received strong { color: #fff; }
  .input-bar { padding: 12px 16px; background: #16213e; border-top: 1px solid #333; display: flex; gap: 8px; }
  .input-bar input { flex: 1; background: #0f3460; border: 1px solid #444; color: #e0e0e0; padding: 8px 12px; border-radius: 4px; font-size: 14px; }
  .input-bar button { padding: 8px 20px; background: #0a9396; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
  .input-bar button:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-mic { background: #6c5ce7; min-width: 44px; }
  .btn-mic:hover { background: #5a4bd1; }
  .btn-mic.recording { background: #e74c3c; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
</style>
</head>
<body>
<div class="header">
  <span class="status-dot disconnected" id="statusDot"></span>
  <input class="url" id="wsUrl" value="ws://localhost:8765/ws" placeholder="WebSocket URL">
  <input class="token" id="authToken" type="password" placeholder="Auth token">
  <button class="btn-connect" id="connectBtn" onclick="toggleConnection()">Connect</button>
</div>
<div class="messages" id="messages"></div>
<div class="input-bar">
  <input id="textInput" placeholder="Type a message..." disabled onkeydown="if(event.key==='Enter')sendText()">
  <button id="sendBtn" onclick="sendText()" disabled>Send</button>
  <button class="btn-mic" id="micBtn" onclick="toggleMic()" disabled title="Push to talk">&#127908;</button>
</div>
<script>
  let ws = null;
  let reqCounter = 0;
  let mediaRecorder = null;
  let audioRequestId = null;
  // Track active streaming response divs and status divs by requestId
  const streamingDivs = new Map();
  const statusDivs = new Map();
  // Track whether a tool event fired since the last text chunk for each requestId
  const toolSinceLastText = new Set();
  // Track requestIds currently in 'speaking' state — these should not be cleared by text chunks
  const speakingRequests = new Set();

  // --- Audio playback (Web Audio API) ---
  // Plays incoming PCM linear16 audio chunks as they arrive.
  // Sample rate is read from each response_audio message (server sends it from config).
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  // Per-requestId playback state: { nextPlayTime, sampleRate }
  const audioPlayback = new Map();

  function playAudioChunk(requestId, b64Data, sampleRate) {
    // Decode base64 to Int16 PCM, convert to Float32 for Web Audio API
    const raw = atob(b64Data);
    const bytes = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
    const int16 = new Int16Array(bytes.buffer);
    const float32 = new Float32Array(int16.length);
    for (let i = 0; i < int16.length; i++) float32[i] = int16[i] / 32768;

    // Create audio buffer
    const buffer = audioCtx.createBuffer(1, float32.length, sampleRate);
    buffer.getChannelData(0).set(float32);

    // Schedule playback — chain chunks sequentially for gapless playback
    let state = audioPlayback.get(requestId);
    if (!state) {
      state = { nextPlayTime: audioCtx.currentTime, sampleRate };
      audioPlayback.set(requestId, state);
    }
    // If we've fallen behind, catch up to current time
    if (state.nextPlayTime < audioCtx.currentTime) {
      state.nextPlayTime = audioCtx.currentTime;
    }

    const source = audioCtx.createBufferSource();
    source.buffer = buffer;
    source.connect(audioCtx.destination);
    source.start(state.nextPlayTime);
    state.nextPlayTime += buffer.duration;
  }

  function stopAudioPlayback(requestId) {
    audioPlayback.delete(requestId);
  }

  function log(cls, text) {
    const el = document.getElementById('messages');
    const time = new Date().toLocaleTimeString();
    const div = document.createElement('div');
    div.className = 'msg ' + cls;
    div.innerHTML = '<span class="time">' + time + '</span>' + escapeHtml(text);
    el.appendChild(div);
    el.scrollTop = el.scrollHeight;
  }

  /** Format tool label in Claude CLI style: ToolName(keyArg) */
  function formatToolHtml(toolName, keyArg) {
    const name = '<span class="tool-name">' + escapeHtml(toolName) + '</span>';
    if (keyArg) {
      const truncated = keyArg.length > 60 ? keyArg.substring(0, 57) + '...' : keyArg;
      return name + '(<span class="tool-arg">' + escapeHtml(truncated) + '</span>)';
    }
    return name;
  }

  function formatUsage(usage) {
    if (!usage) return '';
    const parts = [];
    if (usage.toolUses) parts.push(usage.toolUses + ' tool use' + (usage.toolUses !== 1 ? 's' : ''));
    if (usage.tokens) {
      const k = usage.tokens >= 1000 ? (usage.tokens / 1000).toFixed(1) + 'k' : usage.tokens;
      parts.push(k + ' tokens');
    }
    if (usage.durationMs) parts.push(Math.round(usage.durationMs / 1000) + 's');
    return parts.length ? 'Done (' + parts.join(' \u00b7 ') + ')' : 'Done';
  }

  function createStatusDiv(label) {
    const el = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'msg status';
    div.innerHTML = '<span class="spinner">&#9881;</span><span></span>';
    div.lastElementChild.textContent = label;
    el.appendChild(div);
    el.scrollTop = el.scrollHeight;
    return div;
  }

  /** Create a completed step div: ● ToolName(keyArg) with optional sub-detail */
  function createStepDiv(toolName, keyArg, subDetail) {
    const el = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'msg status step';
    div.innerHTML = '<span class="dot">&#9679;</span>' + formatToolHtml(toolName, keyArg);
    if (subDetail) {
      div.innerHTML += '<span class="sub-detail">\u2514 ' + escapeHtml(subDetail) + '</span>';
    }
    el.appendChild(div);
    el.scrollTop = el.scrollHeight;
    return div;
  }

  /** Ensure the main spinner is always the very last status element */
  function ensureSpinnerAtBottom(state) {
    if (!state.current) return;
    const el = document.getElementById('messages');
    el.appendChild(state.current);
    el.scrollTop = el.scrollHeight;
  }

  function updateStatus(requestId, msg) {
    toolSinceLastText.add(requestId);
    if (!statusDivs.has(requestId)) statusDivs.set(requestId, { current: null, agents: [], steps: [] });
    const state = statusDivs.get(requestId);

    // Sub-agent progress — update active agent's detail line
    if (msg.phase === 'subagent_progress') {
      const activeAgent = state.agents.findLast(a => !a.finished);
      if (activeAgent && activeAgent.detail) {
        activeAgent.detail.textContent = '\u2514 ' + msg.description;
        activeAgent.detail.style.display = '';
      }
      ensureSpinnerAtBottom(state);
      return;
    }

    // Sub-agent completed — mark done with usage stats
    if (msg.phase === 'subagent_completed') {
      const activeAgent = state.agents.findLast(a => !a.finished);
      if (activeAgent) {
        activeAgent.finished = true;
        const spinner = activeAgent.line.querySelector('.spinner');
        if (spinner) spinner.outerHTML = '<span class="dot" style="margin-right:6px">&#9679;</span>';
        // Show completion stats as sub-detail
        if (activeAgent.detail) {
          activeAgent.detail.textContent = '\u2514 ' + formatUsage(msg.usage);
          activeAgent.detail.style.display = '';
        }
      }
      ensureSpinnerAtBottom(state);
      return;
    }

    // Non-tool statuses (thinking, transcribing, etc.)
    if (!msg.toolName) {
      if (msg.status === 'speaking') {
        speakingRequests.add(requestId);
      } else {
        speakingRequests.delete(requestId);
      }
      const label = msg.status === 'thinking' ? 'Processing...'
        : msg.status === 'transcribing' ? 'Transcribing...'
        : msg.status === 'speaking' ? 'Generating voice...'
        : msg.status + '...';
      if (!state.current) {
        state.current = createStatusDiv(label);
      } else {
        state.current.lastElementChild.textContent = label;
        ensureSpinnerAtBottom(state);
      }
      return;
    }

    if (msg.toolName === 'Agent') {
      if (msg.phase === 'start') {
        // Agent started — create line with spinner
        const div = createStatusDiv('Agent');
        const detailDiv = document.createElement('div');
        detailDiv.className = 'msg status agent-detail';
        detailDiv.style.paddingLeft = '28px';
        detailDiv.style.fontSize = '12px';
        detailDiv.style.color = '#888';
        detailDiv.style.display = 'none';
        div.parentNode.insertBefore(detailDiv, div.nextSibling);
        state.agents.push({ line: div, detail: detailDiv, finished: false });
      } else {
        // Complete phase — now have the description (keyArg), update label
        const last = state.agents[state.agents.length - 1];
        if (last) {
          const labelSpan = last.line.lastElementChild;
          labelSpan.innerHTML = formatToolHtml('Agent', msg.keyArg);
        }
      }
      ensureSpinnerAtBottom(state);
    } else if (msg.phase === 'complete') {
      // Tool completed — graduate to a persistent step line
      state.steps.push(createStepDiv(msg.toolName, msg.keyArg));
      // Recreate spinner below
      if (state.current) { state.current.remove(); }
      state.current = createStatusDiv('Thinking...');
    } else {
      // Tool in-progress — show spinner with tool name
      const label = msg.toolName + (msg.keyArg ? '(' + msg.keyArg + ')' : '') + '...';
      if (!state.current) {
        state.current = createStatusDiv(label);
      } else {
        state.current.lastElementChild.textContent = label;
        ensureSpinnerAtBottom(state);
      }
    }
  }

  function removeStatus(requestId) {
    const state = statusDivs.get(requestId);
    if (!state) return;
    // Remove the in-progress spinner
    if (state.current) state.current.remove();
    state.current = null;
    // Mark all agents as finished — replace spinner with green dot
    for (const agent of state.agents) {
      if (!agent.finished) {
        agent.finished = true;
        const spinner = agent.line.querySelector('.spinner');
        if (spinner) spinner.outerHTML = '<span class="dot" style="margin-right:6px">&#9679;</span>';
        if (agent.detail) { agent.detail.remove(); agent.detail = null; }
      }
    }
    // Step lines and finished agent lines stay in the DOM
    statusDivs.delete(requestId);
  }

  // Minimal markdown to HTML (code blocks, inline code, bold, italic, links, paragraphs)
  function renderMarkdown(md) {
    // Escape HTML first
    let html = md.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    // Fenced code blocks
    html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
    // Inline code
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
    // Bold
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    // Italic
    html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
    // Links
    html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" style="color:#74b9ff">$1</a>');
    // Line breaks (double newline = paragraph, single = br)
    html = html.replace(/\n\n/g, '</p><p>').replace(/\n/g, '<br>');
    return '<p>' + html + '</p>';
  }

  function appendStreaming(requestId, text, isFinal) {
    const el = document.getElementById('messages');
    const hadTool = toolSinceLastText.has(requestId);
    if (speakingRequests.has(requestId)) {
      // Keep speaking indicator — but re-position it after the text block below
    } else {
      removeStatus(requestId);
    }
    toolSinceLastText.delete(requestId);

    let entry = streamingDivs.get(requestId);
    // Start a new div if tools ran since the last text chunk
    if (entry && hadTool) {
      // Finalize the previous text block as markdown
      entry.content.innerHTML = renderMarkdown(entry.text);
      entry = null;
    }
    if (!entry) {
      const time = new Date().toLocaleTimeString();
      const div = document.createElement('div');
      div.className = 'msg received';
      div.innerHTML = '<span class="time">' + time + '</span>';
      const span = document.createElement('span');
      div.appendChild(span);
      el.appendChild(div);
      entry = { content: span, text: '' };
      streamingDivs.set(requestId, entry);
    }
    entry.text += text;
    entry.content.textContent = entry.text;
    if (isFinal) {
      entry.content.innerHTML = renderMarkdown(entry.text);
      streamingDivs.delete(requestId);
    }
    // Keep speaking spinner below the growing text block
    if (speakingRequests.has(requestId)) {
      const state = statusDivs.get(requestId);
      if (state && state.current) {
        el.appendChild(state.current);
      }
    }
    el.scrollTop = el.scrollHeight;
  }

  function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function setConnected(connected) {
    const dot = document.getElementById('statusDot');
    const btn = document.getElementById('connectBtn');
    const input = document.getElementById('textInput');
    const send = document.getElementById('sendBtn');
    const mic = document.getElementById('micBtn');
    dot.className = 'status-dot ' + (connected ? 'connected' : 'disconnected');
    btn.textContent = connected ? 'Disconnect' : 'Connect';
    btn.className = connected ? 'btn-disconnect' : 'btn-connect';
    input.disabled = !connected;
    send.disabled = !connected;
    mic.disabled = !connected;
    if (connected) input.focus();
  }

  // Restore saved token on load
  (function() {
    const saved = localStorage.getItem('glasses-auth-token');
    if (saved) document.getElementById('authToken').value = saved;
  })();

  function toggleConnection() {
    if (ws && ws.readyState <= 1) {
      ws.close();
      return;
    }
    const url = document.getElementById('wsUrl').value;
    const token = document.getElementById('authToken').value;
    if (token) localStorage.setItem('glasses-auth-token', token);
    log('system', 'Connecting to ' + url + '...');
    ws = new WebSocket(url);
    ws.onopen = () => {
      if (token) {
        ws.send(JSON.stringify({ type: 'auth', token: token }));
      }
      setConnected(true);
      log('system', 'Connected');
    };
    ws.onclose = () => { setConnected(false); log('system', 'Disconnected'); ws = null; stopMic(); };
    ws.onerror = (e) => { log('error', 'WebSocket error'); };
    ws.onmessage = (e) => {
      try {
        const msg = JSON.parse(e.data);
        if (msg.type === 'response_text') {
          appendStreaming(msg.requestId, msg.text, msg.final);
        } else if (msg.type === 'response_audio') {
          // Resume audio context if suspended (browser autoplay policy)
          if (audioCtx.state === 'suspended') audioCtx.resume();
          playAudioChunk(msg.requestId, msg.data, msg.sampleRate);
        } else if (msg.type === 'response_audio_end') {
          speakingRequests.delete(msg.requestId);
          removeStatus(msg.requestId);
          stopAudioPlayback(msg.requestId);
        } else if (msg.type === 'transcript') {
          removeStatus(msg.requestId);
          log('transcript', 'Transcript: ' + msg.text);
        } else if (msg.type === 'status') {
          updateStatus(msg.requestId, msg);
        } else if (msg.type === 'error') {
          speakingRequests.delete(msg.requestId);
          removeStatus(msg.requestId);
          stopAudioPlayback(msg.requestId);
          log('error', 'Error: ' + msg.message);
        } else {
          log('received', JSON.stringify(msg));
        }
      } catch {
        log('received', e.data);
      }
    };
  }

  function sendText() {
    const input = document.getElementById('textInput');
    const text = input.value.trim();
    if (!text || !ws) return;
    const requestId = 'req-' + (++reqCounter);
    const msg = { type: 'text', requestId, text };
    ws.send(JSON.stringify(msg));
    log('sent', '[' + requestId + '] ' + text);
    input.value = '';
  }

  async function toggleMic() {
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      stopMic();
    } else {
      await startMic();
    }
  }

  async function startMic() {
    if (!ws || ws.readyState !== 1) return;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      // Determine supported mimeType
      const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
        ? 'audio/webm;codecs=opus'
        : MediaRecorder.isTypeSupported('audio/webm')
          ? 'audio/webm'
          : '';

      audioRequestId = 'req-' + (++reqCounter);
      let audioChunks = [];
      mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : {});

      // Send audio_start
      ws.send(JSON.stringify({
        type: 'audio_start',
        requestId: audioRequestId,
        format: { mimeType: mediaRecorder.mimeType },
      }));
      log('sent', '[' + audioRequestId + '] Recording started...');

      // Buffer blobs client-side — send all at once on stop to avoid
      // race conditions between async FileReader and onstop
      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) audioChunks.push(e.data);
      };

      const recorderMimeType = mediaRecorder.mimeType;
      mediaRecorder.onstop = async () => {
        const reqId = audioRequestId;
        if (ws && ws.readyState === 1 && reqId && audioChunks.length > 0) {
          const blob = new Blob(audioChunks, { type: recorderMimeType });
          const arrayBuffer = await blob.arrayBuffer();
          const bytes = new Uint8Array(arrayBuffer);
          // Convert to base64
          let binary = '';
          for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
          const b64 = btoa(binary);
          ws.send(JSON.stringify({ type: 'audio_chunk', requestId: reqId, data: b64 }));
          ws.send(JSON.stringify({ type: 'audio_end', requestId: reqId }));
          log('sent', '[' + reqId + '] Recording stopped (' + Math.round(blob.size / 1024) + ' KB)');
        }
        stream.getTracks().forEach(t => t.stop());
        audioChunks = [];
        audioRequestId = null;
      };

      // Send chunks every 250ms for smoother streaming
      mediaRecorder.start(250);

      document.getElementById('micBtn').classList.add('recording');
    } catch (err) {
      log('error', 'Mic access denied: ' + err.message);
    }
  }

  function stopMic() {
    const micBtn = document.getElementById('micBtn');
    micBtn.classList.remove('recording');
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop();
    }
    mediaRecorder = null;
  }
</script>
</body>
</html>
