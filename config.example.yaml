# Claudeway configuration

# Bot owners — required for DM access, !config, !killall, and cross-channel
# !kill/!nudge. Without this, global magic commands are denied. Every listed
# user gets full owner privileges. Prefer `users:` registry keys (e.g. [alice]);
# raw Slack ids also work when the owner isn't in the registry.
botOwners: ["U0123456789"]
# botOwners: [alice]

# Repo definitions — cloned/pulled on startup into .docker/repos/
repos:
  my-project:
    url: https://github.com/org/my-project.git
    branch: main  # optional, defaults to repo default branch

# Runtime env vars that are not user credentials. Prefer userCredentials below
# for API keys/tokens so shared defaults and per-user overrides live in one place.
# Do NOT list CLAUDE_CODE_OAUTH_TOKEN — every user runs on their own enrolled
# token, injected per spawn from the credential store.
env: []

# Canonical person registry — define each human ONCE; channels reference them by
# name via "members". The registry key is the canonical user id used by the
# per-user credential store, the audit log, and persistent-process identity
# (stable across a person's Slack and voice identities).
# users:
#   alice: { name: "Alice Doe", slack: U0ADMIN001 }
#   bob:   { name: "Bob Roe", slack: U0DEV00002, voice: voice-bob }
#   carol: { slack: U0VIEW0003 }

# Per-user credentials (see docs/per-user-credentials.md).
# BYO Claude is built-in and ALWAYS ON: every user — bot owners included — must
# enroll their own Claude token ("!creds" Slack DM → magic link → web form)
# before the bot processes their messages, so usage runs under and is
# attributed to their own account.
# Hard startup requirements:
#   - CLAUDEWAY_SECRETS_KEY (32-byte hex/base64) in the environment, or a
#     .secrets/key file (generate with: openssl rand -hex 32)
#   - baseUrl (below) — the enrollment form always runs
#
# Optional additional credential types (Jira/GitHub/custom):
#   fields:             form fields + names exposed to the child/tool
#   defaultFromEnv:     explicit shared default source from the server env
#   exposeAs:           "env" (default) or "git-credential-helper" (token never
#                       enters the subprocess env; delivered via per-spawn gitconfig)
# Channel access is the normal permission boundary: allowed users can use shared
# defaults for configured credentials. Personal values enrolled via !creds
# override shared defaults. ("claude" is reserved: built-in.)
# userCredentials:
#   jira:
#     label: "Jira"
#     exposeAs: env
#     fields:
#       JIRA_USERNAME:
#         label: "Jira email"
#         secret: false
#         defaultFromEnv: SHARED_JIRA_USERNAME
#       JIRA_API_TOKEN:
#         label: "Jira API token"
#         defaultFromEnv: SHARED_JIRA_API_TOKEN
#     guidance: "Create an API token at id.atlassian.com → Security → API tokens. Username is your work email."
#     # What the shared default token can/can't do — injected into the agent's
#     # system prompt so it warns users preemptively (and points them at !creds)
#     # instead of attempting a write that fails.
#     sharedAccessNote: "read-only — Jira/Confluence write tools are disabled at the MCP layer for the shared credential; enroll a personal token to write"
#     # MCP servers (mcp.json keys) forced read-only (READ_ONLY_MODE=true) when
#     # this credential does NOT resolve to a personal secret. Atlassian API
#     # tokens can't be scoped, so this is what makes the shared default
#     # actually read-only instead of writing as the token owner.
#     mcpReadOnlyServers: [mcp-atlassian]
#   github:
#     label: "GitHub"
#     exposeAs: git-credential-helper
#     fields:
#       GITHUB_TOKEN:
#         label: "GitHub fine-grained PAT"
#         defaultFromEnv: SHARED_GITHUB_TOKEN
#     guidance: "Fine-grained PAT limited to the repos you need; Contents: Read and write."
#     sharedAccessNote: "read-only — git push and PR creation will fail"

# Credential enrollment web form (magic links issued by "!creds") — always on.
baseUrl: "http://192.168.1.10:8791"   # REQUIRED: how users reach the form (LAN/VPN; put HTTPS in front if exposed wider)
# credsForm:
#   port: 8791   # optional, default 8791

channels:
  C0123456789:
    name: my-project
    repo: my-project  # repo name from repos map, resolved to .docker/repos/my-project
    # Optional: restrict who can use the bot and run magic commands in this channel.
    # If omitted, all channel members can interact with the bot. Users allowed
    # in the channel can use configured shared credential defaults.
    # Reference the users registry:
    # members:
    #   - alice
    #   - bob

  # Voice channel (used by the WebSocket voice adapter)
  # The systemPrompt should be optimized for spoken output (TTS via Deepgram Aura-2).
  # voice-default:
  #   name: my-voice
  #   repo: my-project
  #   systemPrompt: >-
  #     Your responses will be spoken aloud via text-to-speech, not read on a screen.
  #
  #     # Response style
  #
  #     - Be extremely concise. One to three short sentences is ideal.
  #     - Use plain, conversational language — speak like a helpful colleague, not a document.
  #     - Never use markdown, bullet lists, numbered lists, tables, headers, or code blocks.
  #     - Never use special characters like asterisks, backticks, brackets, or pipes.
  #     - For code references, describe them naturally (e.g., "the handle message function in handler dot ts").
  #     - Use punctuation to control pacing: commas for short pauses, periods for longer ones.
  #     - Use question marks and exclamation marks naturally — they influence the speech tone.
  #     - If you need to convey a list, narrate it (e.g., "There are three things: first... second... and third...").
  #
  #     # What to avoid
  #
  #     - No URLs — describe where to find things instead.
  #     - No file paths with slashes — say "config dot yaml in the source directory" instead.
  #     - No emoji or Unicode symbols.
  #     - Don't start responses with filler like "Sure!" or "Great question!" — just answer.
  #   members:
  #     - bob   # registry entry must carry the voice id (users.bob.voice: voice-bob)

# Optional: WebSocket voice server for Meta Ray-Ban glasses (or any WS voice/text client)
# voiceServer:
#   enabled: true
#   port: 8765
#   auth:
#     tokens:
#       - token: "${VOICE_AUTH_TOKEN}"  # env var interpolation supported
#         userId: voice-bob             # voice id from the users registry (users.<id>.voice)
#         defaultChannel: voice-default  # channel to route messages to

# Optional: Voice pipeline config (STT/TTS). Required for audio input via voice adapter.
# Uses Deepgram Nova-3 (STT) and Aura-2 (TTS).
# voice:
#   provider: deepgram
#   deepgram:
#     apiKey: "${DEEPGRAM_API_KEY}"
#     sttModel: nova-3          # optional, defaults to nova-3
#     ttsModel: aura-2-thalia-en # optional, Deepgram Aura-2 voice model
#     ttsSampleRate: 16000       # optional, TTS output Hz (default 24000; 16000 for BT voice path)
#     # Note: Deepgram's `speed` param is REST-only, not supported on WebSocket streaming

defaults:
  model: opus # per-message override: start a Slack message with "!model:<name>"
  # effort: medium # thinking effort: low|medium|high|xhigh|max; per-message override: "!effort:<level>"
  systemPrompt: >-
      # Your responses

      Format all your responses using Slack mrkdwn (NOT Markdown).
      Key formatting: *bold* (single asterisk), _italic_, ~strike~, `code` (single backtick),
      ```code blocks``` (triple backtick, no language tag), > blockquote, <URL|label> for links, :emoji:.
      Never use: headers (#), **double asterisks**, [label](url), tables (| |).
      For tables use a code block with space-aligned columns instead.
      Keep your responses concise.

      # Response structure

      Default to a two-part answer:
      1. A TL;DR first: the key answer in one or two short sentences. No title, no preamble.
      2. Optionally a detail section: deeper explanation, caveats, evidence, steps, references.

      If (and only if) you write a detail section, put a line containing exactly `---DETAILS---`
      between the TL;DR and the details. Everything after that line streams live under a "Details"
      divider and is folded into a collapsed "Details" box once the response completes, so do NOT
      put the main answer there.
      Keep the detail section concise too — a few short lines or bullets, not an essay.
      Omit the marker and the detail section entirely for trivial or one-line answers.

      # Your tools

      You have access to the Claudeway config at CONFIG_PATH which you can read
      and edit when asked to add, remove, or update channel mappings.

      # File attachments

      To attach a file to your Slack response, run: claudeway-attach <absolute-path>.
      This works for both existing files and files you create.
      You can call it multiple times to attach multiple files.
      Files are uploaded to the Slack thread after your response completes.

      # File Handling

      When you handle a file you cannot directly process (binary files like audio, video,
      images, PDFs, Office documents, etc.), Try to convert it to markdown using
      the `markitdown` skill BEFORE telling the user you can't process it. Only report
      failure if the conversion itself fails.
  tempDir: .claudeway-tmp # Temp directory for per-request file attachments (relative to project root)
  # tempMaxAgeDays: 90  # Delete temp files older than N days on startup (default: 90, 0 to disable)
  # threadWorktreeMaxAgeDays: 14  # Prune per-thread git worktrees idle for N days (default: 14, 0 to disable)
  # threadWorktrees: true  # Run each conversation of a repo-backed channel in its own git worktree
  #                        # (default: true; also settable per channel — disable on busy Q&A channels)
  timeoutMs: 300000
  processMode: oneshot # oneshot = new session per message; persistent = reuse session
  responseMode: batch # batch | stream-update | stream-native
  triggerMode: all # all = every message; mention = only when @mentioned
  # collapseWorkingNotes: true # stream-native only: live "🧠 Work log" (reasoning + tool steps), collapsed into an attachment on completion (default: true)
