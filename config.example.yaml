# Claudeway configuration

# Bot owner's Slack user ID — required for DM access, !config, !killall,
# and cross-channel !kill/!nudge. Without this, global magic commands are denied.
botOwner: "U0123456789"

systemChannel: "C0123456789"

# Repo definitions — cloned/pulled on startup into .docker/repos/
repos:
  my-project:
    url: https://github.com/org/my-project.git
    branch: main  # optional, defaults to repo default branch

# Global env vars — every Claude subprocess gets these (regardless of permissions)
env: [CLAUDE_CODE_OAUTH_TOKEN]

# Permission definitions — each bundles env vars exposed when the permission is granted.
# "git" and "jiraWrite" are known names with built-in enforcement:
#   git: enables git credentials + author identity; without it, git auth is blocked
#   jiraWrite: enables full MCP config; without it, MCP is read-only
# Any other name is custom — purely controls env var exposure.
permissions:
  git:
    env: []
    # env: [GIT_SSH_KEY_PATH]  # uncomment if git access needs an SSH key env var
  jiraWrite:
    env: []
    # env: [JIRA_API_TOKEN, JIRA_URL, JIRA_EMAIL]
  # langfuse:                  # custom permission example — env-only, no enforcement
  #   env: [LANGFUSE_SECRET_KEY, LANGFUSE_PUBLIC_KEY, LANGFUSE_HOST]

channels:
  C0123456789:
    name: my-project
    repo: my-project  # repo name from repos map, resolved to .docker/repos/my-project
    # Optional: restrict who can use the bot and run magic commands in this channel.
    # If omitted, all channel members can interact with the bot (read-only).
    # botOwner always has full access regardless of listing.
    # allowedUsers:
    #   - "U0ADMIN001": [git, jiraWrite]  # git + Jira write + their env vars
    #   - "U0DEV00002": [git]              # git only, Jira read-only
    #   - "U0VIEW0003"                     # read-only, global env only

  # Voice channel (used by the WebSocket voice adapter)
  # The systemPrompt should be optimized for spoken output (TTS via Deepgram Aura-2).
  # voice-default:
  #   name: my-voice
  #   repo: my-project
  #   systemPrompt: >-
  #     Your responses will be spoken aloud via text-to-speech, not read on a screen.
  #
  #     # Response style
  #
  #     - Be extremely concise. One to three short sentences is ideal.
  #     - Use plain, conversational language — speak like a helpful colleague, not a document.
  #     - Never use markdown, bullet lists, numbered lists, tables, headers, or code blocks.
  #     - Never use special characters like asterisks, backticks, brackets, or pipes.
  #     - For code references, describe them naturally (e.g., "the handle message function in handler dot ts").
  #     - Use punctuation to control pacing: commas for short pauses, periods for longer ones.
  #     - Use question marks and exclamation marks naturally — they influence the speech tone.
  #     - If you need to convey a list, narrate it (e.g., "There are three things: first... second... and third...").
  #
  #     # What to avoid
  #
  #     - No URLs — describe where to find things instead.
  #     - No file paths with slashes — say "config dot yaml in the source directory" instead.
  #     - No emoji or Unicode symbols.
  #     - Don't start responses with filler like "Sure!" or "Great question!" — just answer.
  #   allowedUsers:
  #     - "voice-user": [git]

# Optional: WebSocket voice server for Meta Ray-Ban glasses (or any WS voice/text client)
# voiceServer:
#   enabled: true
#   port: 8765
#   auth:
#     tokens:
#       - token: "${VOICE_AUTH_TOKEN}"  # env var interpolation supported
#         userId: voice-user            # mapped to channel allowedUsers
#         defaultChannel: voice-default  # channel to route messages to

# Optional: Voice pipeline config (STT/TTS). Required for audio input via voice adapter.
# Uses Deepgram Nova-3 (STT) and Aura-2 (TTS).
# voice:
#   provider: deepgram
#   deepgram:
#     apiKey: "${DEEPGRAM_API_KEY}"
#     sttModel: nova-3          # optional, defaults to nova-3
#     ttsModel: aura-2-thalia-en # optional, Deepgram Aura-2 voice model
#     ttsSampleRate: 16000       # optional, TTS output Hz (default 24000; 16000 for BT voice path)
#     # Note: Deepgram's `speed` param is REST-only, not supported on WebSocket streaming

defaults:
  model: opus # per-message override: start a Slack message with "!model:<name>"
  # effort: medium # thinking effort: low|medium|high|xhigh|max; per-message override: "!effort:<level>"
  systemPrompt: >-
      # Your responses

      Format all your responses using Slack mrkdwn (NOT Markdown).
      Key formatting: *bold* (single asterisk), _italic_, ~strike~, `code` (single backtick),
      ```code blocks``` (triple backtick, no language tag), > blockquote, <URL|label> for links, :emoji:.
      Never use: headers (#), **double asterisks**, [label](url), tables (| |).
      For tables use a code block with space-aligned columns instead.
      Keep your responses concise.

      # Your tools

      You have access to the Claudeway config at CONFIG_PATH which you can read
      and edit when asked to add, remove, or update channel mappings.

      # File attachments

      To attach a file to your Slack response, run: claudeway-attach <absolute-path>.
      This works for both existing files and files you create.
      You can call it multiple times to attach multiple files.
      Files are uploaded to the Slack thread after your response completes.

      # File Handling

      When you handle a file you cannot directly process (binary files like audio, video,
      images, PDFs, Office documents, etc.), Try to convert it to markdown using
      the `markitdown` skill BEFORE telling the user you can't process it. Only report
      failure if the conversion itself fails.
  tempDir: .claudeway-tmp # Temp directory for per-request file attachments (relative to project root)
  # tempMaxAgeDays: 90  # Delete temp files older than N days on startup (default: 90, 0 to disable)
  timeoutMs: 300000
  processMode: oneshot # oneshot = new session per message; persistent = reuse session
  responseMode: batch # batch | stream-update | stream-native
  triggerMode: all # all = every message; mention = only when @mentioned
  # collapseWorkingNotes: true # stream-native only: live "🧠 Working notes" (reasoning + tool steps), collapsed into an attachment on completion (default: true)
