# Claudeway configuration

# Bot owner's Slack user ID — required for DM access, !config, !killall,
# and cross-channel !kill/!nudge. Without this, global magic commands are denied.
botOwner: "U0123456789"

systemChannel: "C0123456789"

# Repo definitions — cloned/pulled on startup into .docker/repos/
repos:
  my-project:
    url: https://github.com/org/my-project.git
    branch: main  # optional, defaults to repo default branch

channels:
  C0123456789:
    name: my-project
    repo: my-project  # repo name from repos map, resolved to .docker/repos/my-project
    # Optional: restrict who can use the bot and run magic commands in this channel.
    # If omitted, all channel members can interact with the bot (read-only).
    # botOwner always has full access regardless of listing.
    # allowedUsers:
    #   - "U0ADMIN001": [git, jiraWrite]  # full access (git push + Jira write)
    #   - "U0DEV00002": [git]              # git access, Jira read-only
    #   - "U0VIEW0003"                     # read-only (default)

  # Glasses channel (used by the WebSocket glasses adapter)
  # glasses-default:
  #   name: my-glasses
  #   repo: my-project
  #   allowedUsers:
  #     - "glasses-user": [git]

# Optional: WebSocket server for Meta Ray-Ban glasses (or any WS text client)
# glassesServer:
#   enabled: true
#   port: 8765
#   auth:
#     tokens:
#       - token: "${GLASSES_AUTH_TOKEN}"  # env var interpolation supported
#         userId: glasses-user            # mapped to channel allowedUsers
#         defaultChannel: glasses-default  # channel to route messages to

defaults:
  model: opus
  systemPrompt: >-
      # Your responses

      Format all your responses using Slack mrkdwn (NOT Markdown).
      Key formatting: *bold* (single asterisk), _italic_, ~strike~, `code` (single backtick),
      ```code blocks``` (triple backtick, no language tag), > blockquote, <URL|label> for links, :emoji:.
      Never use: headers (#), **double asterisks**, [label](url), tables (| |).
      For tables use a code block with space-aligned columns instead.
      Keep your responses concise.

      # Your tools

      You have access to the Claudeway config at CONFIG_PATH which you can read
      and edit when asked to add, remove, or update channel mappings.

      # File attachments

      To attach a file to your Slack response, run: claudeway-attach <absolute-path>.
      This works for both existing files and files you create.
      You can call it multiple times to attach multiple files.
      Files are uploaded to the Slack thread after your response completes.

      # File Handling

      When you handle a file you cannot directly process (binary files like audio, video,
      images, PDFs, Office documents, etc.), Try to convert it to markdown using
      the `markitdown` skill BEFORE telling the user you can't process it. Only report
      failure if the conversion itself fails.
  tempDir: .claudeway-tmp # Temp directory for per-request file attachments (relative to project root)
  timeoutMs: 300000
  processMode: oneshot # oneshot = new session per message; persistent = reuse session
  responseMode: batch # batch | stream-update | stream-native
  triggerMode: all # all = every message; mention = only when @mentioned
