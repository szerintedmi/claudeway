services:
  claudeway:
    build:
      context: .
      additional_contexts:
        skills: ./.docker/skills-empty
    container_name: claudeway
    restart: unless-stopped
    environment:
      - HOME=/home/claudeway
      - USER=claudeway
      # Claudeway process needs these (never passed to Claude subprocess)
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_APP_TOKEN=${SLACK_APP_TOKEN}
      # Claude subprocess gets this via global env config
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN}
      # Voice pipeline (Claudeway-internal, not for Claude subprocess)
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY:-}
      - VOICE_AUTH_TOKEN=${VOICE_AUTH_TOKEN:-}
      # Langfuse (passed to Claude via permissions.langfuse.env)
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-}
    ports:
      - "${VOICE_PORT:-8765}:${VOICE_PORT:-8765}"  # Voice WebSocket server (only used when voiceServer.enabled)
    volumes:
      # Config (read-only)
      - ./config.yaml:/app/config.yaml:ro
      - ./mcp.json:/app/mcp.json:ro  # optional, remove if not used

      # Claude CLI session state (created at runtime, persisted across restarts)
      - claudeway-claude-state:/home/claudeway/.claude

      # Git SSH key (read-only) — for cloning repos via SSH
      # Mount your GitHub SSH private key here
      - ~/.ssh/id_ed25519_hostaway:/home/claudeway/.ssh/id_ed25519:ro

      # Persistent state (repos, queue, files) — shared with host
      - ./.docker:/app/.docker
    security_opt:
      - no-new-privileges:true
    read_only: false  # Claude needs to write to work folders
    tmpfs:
      - /tmp:size=100M

volumes:
  claudeway-claude-state:
