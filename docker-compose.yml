services:
  claudeway:
    build:
      context: .
      additional_contexts:
        skills: ./.docker/skills-empty
    container_name: claudeway
    restart: unless-stopped
    environment:
      - HOME=/home/claudeway
      - USER=claudeway
      # Claudeway process needs these (never passed to Claude subprocess)
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_APP_TOKEN=${SLACK_APP_TOKEN}
      # Master key for the per-user credential store (required; users enroll
      # their own Claude tokens via !creds — no server-wide Claude token)
      - CLAUDEWAY_SECRETS_KEY=${CLAUDEWAY_SECRETS_KEY}
      # Voice pipeline (Claudeway-internal, not for Claude subprocess)
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY:-}
      - VOICE_AUTH_TOKEN=${VOICE_AUTH_TOKEN:-}
      # Shared credential defaults (mapped through userCredentials.defaultFromEnv)
      - SHARED_JIRA_USERNAME=${SHARED_JIRA_USERNAME:-}
      - SHARED_JIRA_API_TOKEN=${SHARED_JIRA_API_TOKEN:-}
      - SHARED_GITHUB_TOKEN=${SHARED_GITHUB_TOKEN:-}
      - SHARED_NEWRELIC_API_KEY=${SHARED_NEWRELIC_API_KEY:-}
      - SHARED_LANGFUSE_SECRET_KEY=${SHARED_LANGFUSE_SECRET_KEY:-}
      - SHARED_LANGFUSE_PUBLIC_KEY=${SHARED_LANGFUSE_PUBLIC_KEY:-}
      - SHARED_LANGFUSE_HOST=${SHARED_LANGFUSE_HOST:-}
    ports:
      - "${VOICE_PORT:-8765}:${VOICE_PORT:-8765}"  # Voice WebSocket server (only used when voiceServer.enabled)
      - "${CREDS_PORT:-8791}:${CREDS_PORT:-8791}"  # !creds enrollment form (always on)
    volumes:
      # Config (read-only). create_host_path: false makes the container fail to
      # start if the source file is missing, instead of silently creating a
      # directory at the host path (which then breaks the app at runtime).
      - type: bind
        source: ./config.yaml
        target: /app/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./mcp.json
        target: /app/mcp.json
        read_only: true
        bind:
          create_host_path: false

      # Claude CLI session state (created at runtime, persisted across restarts)
      - claudeway-claude-state:/home/claudeway/.claude

      # Git SSH key (read-only) — for cloning repos via SSH.
      # Set GIT_SSH_KEY in .env to your private key path (default: ~/.ssh/id_ed25519).
      - type: bind
        source: ${GIT_SSH_KEY:-~/.ssh/id_ed25519}
        target: /home/claudeway/.ssh/id_ed25519
        read_only: true
        bind:
          create_host_path: false

      # Persistent state (repos, queue, files) — shared with host
      - ./.docker:/app/.docker

      # Encrypted per-user credential store — must survive container recreation
      - ./.secrets:/app/.secrets
    security_opt:
      - no-new-privileges:true
    read_only: false  # Claude needs to write to work folders
    tmpfs:
      - /tmp:size=100M

volumes:
  claudeway-claude-state:
